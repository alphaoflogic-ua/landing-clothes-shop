<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>brands</title>
    <script type="module" src="/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section class="brands py-lg bg-bg-dark">
      <ul class="max-w-page mx-auto px-gutter brands__list flex justify-between items-center">
        <li class="brands__item flex items-center">
          <img class="brands__logo" src="/images/brands/versace.svg" alt="Versace" />
        </li>
        <li class="brands__item flex items-center">
          <img class="brands__logo" src="/images/brands/zara.svg" alt="Zara" />
        </li>
        <li class="brands__item flex items-center">
          <img class="brands__logo" src="/images/brands/gucci.svg" alt="Gucci" />
        </li>
        <li class="brands__item flex items-center">
          <img class="brands__logo" src="/images/brands/prada.svg" alt="Prada" />
        </li>
        <li class="brands__item flex items-center">
          <img class="brands__logo" src="/images/brands/calvin-klein.svg" alt="Calvin Klein" />
        </li>
      </ul>
    </section>

    <script type="module">
      import { init } from './brands.js';
      init(document);
    </script>
  </body>
</html>
