<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section
      class="newsletter flex justify-between items-center py-lg px-2xl rounded-md bg-bg-dark"
    >
      <h2 class="newsletter__title font-heading text-subtitle text-on-dark">
        STAY UPTO DATE ABOUT OUR LATEST OFFERS
      </h2>

      <form class="newsletter__form flex flex-col gap-xs w-form shrink-0">
        <input
          class="newsletter__input py-xs pr-md pl-[calc(var(--spacing-md)+var(--spacing-icon)+var(--spacing-sm))] rounded-pill bg-bg bg-[url('/images/newsletter/mail.svg')] bg-no-repeat bg-position-[var(--spacing-md)_center] bg-size-[var(--spacing-icon)] text-text placeholder:text-text-muted"
          type="email"
          name="email"
          placeholder="Enter your email address"
          aria-label="Email address"
        />
        <button
          class="newsletter__button py-xs px-md rounded-pill bg-bg text-text cursor-pointer hover:opacity-85"
          type="submit"
        >
          Subscribe to Newsletter
        </button>
      </form>
    </section>

    <script type="module">
      import { init } from './newsletter.js';
      init(document);
    </script>
  </body>
</html>
