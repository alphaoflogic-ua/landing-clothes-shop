<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>example</title>
    <script type="module" src="/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section class="example p-lg border border-border rounded-md bg-surface">
      <img
        class="example__image w-full max-w-80 mb-md rounded-sm"
        src="/images/example/placeholder.svg"
        alt="Placeholder picture"
      />
      <h2 class="example__title mb-sm font-heading text-subtitle">Example component</h2>
      <p class="example__text mb-md text-text-muted">
        Це еталонний компонент. Дивись на його файли, коли робиш свій.
      </p>
      <button
        class="example__toggle py-sm px-md rounded-pill bg-text text-on-dark cursor-pointer hover:opacity-85"
        type="button"
      >
        Show details
      </button>
      <p class="example__details mt-md" hidden>Деталі показуються після кліку.</p>
    </section>

    <script type="module">
      import { init } from './example.js';
      init(document);
    </script>
  </body>
</html>
