<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>promo-bar</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <script type="module" src="/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="promo-bar py-sm bg-bg-dark text-on-dark">
      <div
        class="max-w-page mx-auto px-gutter promo-bar__inner relative flex justify-center items-center"
      >
        <p class="promo-bar__text text-caption">
          Sign up and get 20% off to your first order.
          <a class="promo-bar__link underline" href="#">Sign Up Now</a>
        </p>
        <button
          class="promo-bar__close absolute right-gutter top-1/2 -translate-y-1/2 cursor-pointer"
          type="button"
          aria-label="Close"
        >
          <img class="promo-bar__icon size-icon-md" src="/images/promo-bar/close.svg" alt="" />
        </button>
      </div>
    </div>

    <script type="module">
      import { init } from './promo-bar.js';
      init(document);
    </script>
  </body>
</html>
