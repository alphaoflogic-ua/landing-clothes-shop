<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homepage</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/page.css" />
    <script type="module" src="/js/include.js"></script>
  </head>
  <body>
    <div data-include="promo-bar"></div>
    <div class="container">
      <div data-include="header"></div>
    </div>
    <div data-include="hero"></div>
    <div data-include="brands"></div>
    <main>
      <div
        data-include="product-card"
        data-title="Skinny Fit Jeans"
        data-photo="/images/product-card/jeans.png"
        data-price="240"
        data-rating="3.5"
        data-old-price="260"
        data-discount="20"
      ></div>
      <div
        data-include="product-card"
        data-title="T-shirt with Tape Details"
        data-photo="/images/product-card/tshirt-tape.png"
        data-price="120"
        data-rating="4.5"
      ></div>
      <div
        data-include="product-card"
        data-title="Checkered Shirt"
        data-photo="/images/product-card/checkered-shirt.png"
        data-price="180"
        data-rating="4.5"
      ></div>
      <div
        data-include="product-card"
        data-title="Sleeve Striped T-shirt"
        data-photo="/images/product-card/sleeve-striped-tshirt.png"
        data-price="130"
        data-rating="3.5"
        data-old-price="160"
        data-discount="30"
      ></div>
      <div
        data-include="product-card"
        data-title="Vertical Striped Shirt"
        data-photo="/images/product-card/vertical-striped-shirt.png"
        data-price="212"
        data-rating="5.0"
        data-old-price="232"
        data-discount="20"
      ></div>
      <div
        data-include="product-card"
        data-title="Courage Graphic T-shirt"
        data-photo="/images/product-card/courage-tshirt.png"
        data-price="145"
        data-rating="4.0"
      ></div>
      <div
        data-include="product-card"
        data-title="Loose Fit Bermuda Shorts"
        data-photo="/images/product-card/bermuda-shorts.png"
        data-price="80"
        data-rating="3.0"
      ></div>
      <div
        data-include="product-card"
        data-title="Faded Skinny Jeans"
        data-photo="/images/product-card/faded-jeans.png"
        data-price="210"
        data-rating="4.5"
      ></div>
    </main>
    <div class="container page__newsletter">
      <div data-include="newsletter"></div>
    </div>
    <div data-include="footer"></div>
  </body>
</html>
