<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homepage</title>
    <script type="module" src="/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="/js/include.js"></script>
  </head>
  <body>
    <div data-include="promo-bar"></div>
    <div class="max-w-page mx-auto px-gutter">
      <div data-include="header"></div>
    </div>
    <div data-include="hero"></div>
    <div data-include="brands"></div>
    <main>
      <div class="max-w-page mx-auto px-gutter">
        <div data-include="product-list" data-heading="New Arrivals" data-group="new"></div>
        <hr class="border-t border-border" />
        <div data-include="product-list" data-heading="Top Selling" data-group="top"></div>
      </div>
    </main>
    <div class="max-w-page mx-auto px-gutter relative -mb-newsletter-overlap">
      <div data-include="newsletter"></div>
    </div>
    <div data-include="footer"></div>
  </body>
</html>
